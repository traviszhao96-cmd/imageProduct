version: "1.0"
skill_id: knowledge-base-manage
eval_type: content
cases:
  - id: case-kb-v7-update-path
    threshold: 0.8
    task: "用户要求给 Camera KB 新增一个能力，并让本地 KB HTML 能看到。根据 SKILL.md，说明应修改哪些源文件、执行哪些命令，以及哪些生成文件不能手工编辑。"
    rubric:
      - id: source
        check: "把 scripts/build_kb_functions_algorithms.py 识别为 KB 节点定义的编辑入口，并要求先读取 knowledge/reference/kb-functions-algorithms-schema.md"
        weight: 3
      - id: build
        check: "执行 python3 scripts/build_kb_functions_algorithms.py，并检查 v7 audit"
        weight: 2
      - id: visualizer
        check: "执行 python3 scripts/build_kb_visualizer.py，并验证 outputs/kb-visualizer/data.js 或页面"
        weight: 2
      - id: generated
        check: "明确禁止手工编辑生成的 KB JSON、knowledge/feature-tree.md 和 outputs/kb-visualizer/data.js"
        weight: 2

  - id: case-tree-single-source
    threshold: 0.8
    task: "用户说需要调整 Camera Feature Tree 的层级，但不想维护 Tree 和 KB 两套数据。根据 SKILL.md 应如何处理？"
    rubric:
      - id: hierarchy
        check: "通过 KB 节点的 节点 ID / 父节点 ID 调整层级"
        weight: 3
      - id: no-manual-tree
        check: "明确 Tree 是生成视图，不手工修改 knowledge/feature-tree.md"
        weight: 3
      - id: regenerate
        check: "运行 KB builder 重新生成 Tree 并检查孤儿父节点、重复 ID 等审计"
        weight: 2

  - id: case-fl-projection
    threshold: 0.8
    task: "需求列表新增一个用户可感知功能，但 26111 和 26121 的支持状态完全一样。KB 已经有相邻能力，当前 FL 也有一条可以承载新验收目标的行。判断是否进入 FL、应该新增还是更新，以及由哪个 skill 执行线上写入。"
    rubric:
      - id: enter
        check: "认为新功能类需求属于 FL 输入，即使两个项目支持相同也需要在 FL 体现"
        weight: 3
      - id: update
        check: "优先更新能承载新需求和验收目标的现有 FL 行，而不是重复新增"
        weight: 3
      - id: routing
        check: "使用 feature-list-writer 处理 FL 规则，并使用 lark-base 执行线上 Base 读写与回读验证"
        weight: 2

  - id: case-code-is-not-product-support
    threshold: 0.8
    task: "CameraApp 中发现一个 UI Node 类和一个 SettingKey，但生产模式数组与 ProductConfig 中没有入口。应该如何写入 KB，能否直接在 FL 标记支持？"
    rubric:
      - id: status
        check: "不能仅凭类或 key 判断生产支持，应记录代码绑定并将实现状态标为规划中、待确认、内部或调试中的合适值"
        weight: 3
      - id: projection
        check: "没有生产入口时不应直接投影为支持的 FL 功能行"
        weight: 3
      - id: evidence
        check: "要求继续检查 ProductConfig、模式数组、真实入口或项目需求证据"
        weight: 2
