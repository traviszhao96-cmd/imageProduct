version: '1.0'
skill_id: knowledge-base-manage
eval_type: content
cases:
- id: case-device-config
  threshold: 0.75
  task: "以下是项目 26111 的设备配置文件部分内容。请根据 SKILL.md 的流程，回答：(1) 26111 Base 的主摄 sensor 是什么？有没有\
    \ OIS？(2) 26121 Pro 各摄像头的 sensor 和焦段信息（主摄、超广角、长焦分别列出）。(3) 这个项目的软件基线是什么。\n\n```\n\
    project:\n  code: \"26111\"\n  name: \"Phone 5a\"\n  soc:\n    base: \"SM7635\"\
    \n    pro: \"SM7750\"\ninheritance:\n  baseline: \"25131\"\n  rules:\n    - \"\
    26111 Base: 200M HP5 主摄，无长焦，继承 25131 功能并移除不适用项\"\n    - \"26121 Pro: 与 25111 Pro\
    \ 配置完全一致，全功能继承\"\ncameras:\n  base:\n    main:\n      sensor: \"HP5\"\n      resolution:\
    \ \"200MP\"\n      ois: NO\n    ultrawide:\n      sensor: \"IMX355\"\n      resolution:\
    \ \"8MP\"\n    tele: null\n  pro:\n    main:\n      sensor: \"IMX896\"\n     \
    \ resolution: \"50MP\"\n      ois: YES\n    ultrawide:\n      sensor: \"IMX355\"\
    \n      resolution: \"8MP\"\n    tele:\n      sensor: \"JN5\"\n      resolution:\
    \ \"50MP\"\n      zoom: \"3.5x\"\n      ois: YES\n```\n"
  rubric:
  - id: r1
    check: 回答 26111 Base 主摄是 HP5 200MP，无 OIS
    weight: 2
  - id: r2
    check: 回答 26121 Pro 主摄 IMX896 50MP、超广角 IMX355 8MP、长焦 JN5 50MP 3.5x，三个摄像头的信息都覆盖到
    weight: 2
  - id: r3
    check: 回答软件基线是 25131
    weight: 2
  - id: r4
    check: 回答 Pro 配置继承自 25111 Pro
    weight: 1
- id: case-default-focal
  threshold: 0.75
  task: "以下是两个项目的默认值配置。请根据 SKILL.md 的知识库结构，回答：(1) 项目 24111 和 24111 Plus 的人像模式默认焦段分别是多少（同时给出倍率和等效焦距）？(2)\
    \ 项目 25111 的人像模式默认焦段是多少？(3) 为什么不同项目的人像默认焦段不一样——这个值取决于什么？\n\n```\n项目 24111 defaults:\n\
    \  portrait:\n    focal_length: \"2x\"\n    equivalent_focal: \"50mm\"\n项目 24111\
    \ Plus defaults:\n  portrait:\n    focal_length: \"3x\"\n    equivalent_focal:\
    \ \"72mm\"\n项目 25111 defaults:\n  portrait:\n    focal_length: \"3.5x\"\n    equivalent_focal:\
    \ \"80mm\"\n```\n"
  rubric:
  - id: r1
    check: 回答 24111 是 2x (50mm)，24111 Plus 是 3x (72mm)，同时给出倍率和等效焦距
    weight: 2
  - id: r2
    check: 回答 25111 是 3.5x (80mm)
    weight: 2
  - id: r3
    check: 回答默认焦段取决于项目的硬件配置（如是否有长焦、长焦倍数），不同项目不同
    weight: 1
- id: case-preset-focal-inference
  threshold: 0.75
  task: "以下是项目 25111 和 24111 的默认值配置，以及预设列表。预设中标记\"使用默认值\"的，表示需要根据所在模式和项目查表确定焦段。请回答：(1)\
    \ Soft Focus 是 Portrait 模式，在项目 25111 上应该用哪个焦段（同时给出倍率和等效焦距）？(2) Amber 是 Photo 模式，在项目\
    \ 25111 上应该用哪个焦段？(3) 如果换到项目 24111，Soft Focus 的焦段会变成多少？\n\n```\n项目 25111 defaults:\n\
    \  portrait:\n    focal_length: \"3.5x\"\n    equivalent_focal: \"80mm\"\n  photo:\n\
    \    focal_length: \"1x\"\n    equivalent_focal: \"24mm\"\n项目 24111 defaults:\n\
    \  portrait:\n    focal_length: \"2x\"\n    equivalent_focal: \"50mm\"\n  photo:\n\
    \    focal_length: \"1x\"\n    equivalent_focal: \"26mm\"\npresets:\n  - Soft\
    \ Focus | Mode=Portrait | Focal=使用默认值\n  - Amber | Mode=Photo | Focal=使用默认值\n\
    \  - Cine Amber | Mode=Video | Focal=24mm\n  - Urban | Mode=Photo | Focal=28mm\
    \ (覆盖默认值)\n```\n"
  rubric:
  - id: r1
    check: 回答 Soft Focus 在 25111 上用 3.5x (80mm)，因为它是 Portrait 模式，取 25111 的 portrait
      默认值，同时输出倍率和等效焦距
    weight: 2
  - id: r2
    check: 回答 Amber 在 25111 上用 1x (24mm)，因为它是 Photo 模式，取 25111 的 photo 默认值
    weight: 2
  - id: r3
    check: 回答换到 24111 后 Soft Focus 变成 2x (50mm)
    weight: 2
