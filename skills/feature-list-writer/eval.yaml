version: '1.0'
skill_id: feature-list-writer
eval_type: content
cases:
- id: case-fl-boundary
  threshold: 0.8
  task: "评审 FL 时发现一行叫 PZL，详细记录 ZSL/后取帧时序、帧数和算法叠加顺序。应该保留吗？"
  rubric:
  - id: r1
    check: 明确 PZL/取帧策略不作为 KB 或 FL 能力行
    weight: 2
  - id: r2
    check: 指出帧时序、帧数、阈值和叠加顺序属于软件设计
    weight: 2
  - id: r3
    check: FL 只保留需要独立确认的能力支持结论及模式/摄像头/规格/焦段范围
    weight: 2
- id: case-owner-routing
  threshold: 0.8
  task: "一行是视频算法支持焦段，当前确认负责人写 Product / SE / IQA。另一个是纯设置交互。请说明主责人与评审角色应该怎么填。"
  rubric:
  - id: r1
    check: 主责确认人必须是一个具体姓名且单选，不能填写角色组合
    weight: 2
  - id: r2
    check: 视频算法支持焦段默认由 HAL SE 对应人员主责，评审角色可包含 HAL SE 和 IQA/SQA 等参与者
    weight: 2
  - id: r3
    check: 纯设置交互默认由 Product 对应人员主责，评审角色包含 Product、APP、SQA
    weight: 2
  - id: r4
    check: 没有人员映射时标记待确认或 OWNER_AMBIGUOUS，不编造姓名
    weight: 1
- id: case-description-quality
  threshold: 0.8
  task: "FL 的说明是：‘在对应模式打开入口，确认选项、状态保持。26111 支持。’ 请审核并说明如何改。"
  rubric:
  - id: r1
    check: 判定说明机械且把验证步骤、项目支持结论误当成能力说明
    weight: 2
  - id: r2
    check: 要求说明功能或算法是什么、解决什么问题、适用模式/摄像头/规格/焦段或触发边界
    weight: 2
  - id: r3
    check: 不在缺少事实时编造具体范围，而是提出准确的主责人确认问题
    weight: 2
- id: case-unsupported-causality
  threshold: 0.8
  task: "Quality 的 UW 标记为不支持，原因写‘按当前项目硬件、PRD 或基线 FL，该摄像头不在支持范围。’ 应该如何处理？"
  rubric:
  - id: r1
    check: 明确拒绝把基线或支持范围结论当作不支持原因
    weight: 2
  - id: r2
    check: 说明 Quality 依赖摄像头高像素 Sensor 输出模式和 Remosaic/高像素输出链路
    weight: 2
  - id: r3
    check: 写出缺少对应高像素输出档位所以不能提供 Quality 切换的因果关系
    weight: 2
  - id: r4
    check: 若依赖缺口无法确认，应改为 TBD/待确认而不是保留无证据的已确认叉号
    weight: 1
- id: case-stateful-feature-description
  threshold: 0.8
  task: "一个设置项说明写成：‘省电录制功能，用于节省电量。’ 已知默认关闭，开启后设备静止时关闭预览屏但保持录制，移动或触摸后恢复。请审核并改写。"
  rubric:
  - id: r1
    check: 说明用户收益是降低长时间录像时的屏幕与相机预览功耗
    weight: 2
  - id: r2
    check: 写清开启后的触发条件、预览关闭、录制不中断和恢复行为
    weight: 2
  - id: r3
    check: 写清默认关闭以及关闭时不触发自动息屏
    weight: 2
  - id: r4
    check: 不用来源、继承关系、评审过程或冗长同义句填充说明
    weight: 1
- id: case-unknown-default
  threshold: 0.8
  task: "某开关的用途和开启效果已知，但默认状态在现有资料中没有写。AI 应该怎样填写说明和评审状态？"
  rubric:
  - id: r1
    check: 保留已知用途和开启/关闭影响，不编造默认值
    weight: 2
  - id: r2
    check: 将默认状态列为明确的主责确认问题
    weight: 2
  - id: r3
    check: 在默认状态影响验收时保持待确认，而不是用继承项目推断为已确认
    weight: 2
- id: case-memory-rule
  threshold: 0.8
  task: "一个相机开关默认关闭，切换模式和前后置时记忆，进入图库/设置以及 5 分钟内返回时记忆，超过 5 分钟或安全相机恢复默认。FL 说明和详细规则应该分别怎么写？"
  rubric:
  - id: r1
    check: FL 说明简洁写出默认关闭、关键记忆场景和超过 5 分钟/安全相机恢复默认
    weight: 2
  - id: r2
    check: 不把九个场景逐列复制进 FL 说明，完整矩阵保留在 KB 或 memory-mutex 参考数据
    weight: 2
  - id: r3
    check: 指出当前 memory-mutex 是 25111 MP1.5 基线，26111/26121 的差异必须确认，不能静默继承
    weight: 2
- id: case-wordy-but-empty
  threshold: 0.8
  task: "一段功能说明有四句话，反复说‘提升体验、满足需求、支持该能力、按项目配置’，但没有行为、结果或默认状态。应该因为字数多而通过吗？"
  rubric:
  - id: r1
    check: 明确判定为言之无物，字数不构成质量
    weight: 2
  - id: r2
    check: 要求删除重复和流程性句子，只保留目的、行为、结果、默认/范围等有效信息
    weight: 2
  - id: r3
    check: 事实不足时输出精确澄清问题，不生成看似完整的机器文案
    weight: 2
