cases:
- id: case-create-gallery-story
  threshold: 0.75
  task: 'PM 需要在 NOS 项目中创建一个 Gallery 功能需求 Story。请根据 SKILL.md 的 PM Issue 内容规范，写出创建这个
    issue 的完整 CLI 命令。需求概要：标题 "Add album sort by captured date"，让用户能按拍摄日期排序相册，PRD 在
    https://nothing-tech.sg.larksuite.com/wiki/abc，Figma 在 https://www.figma.com/design/xyz。


    ```

    project: NOS

    type: Story

    component: NTGallery

    device: all_phones

    epic: NOS-10644

    assignee: 712020:3b...dff

    ```

    '
  rubric:
  - id: r1
    check: 命令包含 --description，且描述中至少包含「需求背景」和「需求描述」两个章节
    weight: 2
  - id: r2
    check: 描述中附上了 PRD 链接和 Figma 链接
    weight: 2
  - id: r3
    check: 命令使用 --project NOS --issue-type Story，且提到 customfield_10101 (Device) 和
      components
    weight: 2
  - id: r4
    check: 回答中提到 Epic Link 用 customfield_10014，不是 parent
    weight: 1
- id: case-detect-pitfalls
  threshold: 0.75
  task: "以下是一个 PM 尝试创建的 Jira issue 配置。但这个配置有 3 个错误。请根据 SKILL.md 的「NOS Project 已知陷阱」逐一指出错误并给出修正。\n\
    \n```\n{\n  \"fields\": {\n    \"project\": {\"key\": \"NOS\"},\n    \"issuetype\"\
    : {\"name\": \"Story\"},\n    \"summary\": \"Add filter by media type\",\n   \
    \ \"parent\": {\"key\": \"NOS-10644\"},\n    \"customfield_10101\": {\"value\"\
    : \"all_phones\"},\n    \"components\": []\n  }\n}\n```\n"
  rubric:
  - id: r1
    check: 指出 parent 字段错误：Epic Link 应该用 customfield_10014，不是 parent
    weight: 2
  - id: r2
    check: '指出 customfield_10101 (Device) 格式错误：应该是数组 [{"value": "all_phones"}]，不是单对象'
    weight: 2
  - id: r3
    check: '指出 components 错误：不能是空数组 []，必须选已有组件名如 {"name": "NTGallery"}'
    weight: 1
- id: case-epic-link-method
  threshold: 0.75
  task: '一个已创建的 Story (NOS-12345) 需要关联到 Epic NOS-10644。PM 尝试用 CLI 的 update 命令设置 parent
    字段但失败了。请根据 SKILL.md 回答：(1) 为什么 CLI update 会失败？(2) 推荐的替代方案是什么？写出具体方法。


    ```

    # PM 尝试的命令（失败）

    jira_cli.py update --issue NOS-12345 --fields-json ''{"parent": {"key": "NOS-10644"}}''


    # 正确的做法

    PUT /rest/api/3/issue/NOS-12345

    {"fields": {"customfield_10014": "NOS-10644"}}

    ```

    '
  rubric:
  - id: r1
    check: 回答 CLI update --fields-json 对 HTTP 204 返回 {} 无法区分成功和静默失败，parent 字段会被静默丢弃
    weight: 2
  - id: r2
    check: 回答推荐用 REST API PUT /rest/api/3/issue/{key} 直接设置 customfield_10014
    weight: 2
  - id: r3
    check: 回答中提到设置后必须 get 验证关键字段
    weight: 1
