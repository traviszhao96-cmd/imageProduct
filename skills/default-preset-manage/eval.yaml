version: '1.0'
skill_id: default-preset-manage
eval_type: content
cases:
- id: case-fill-rules
  threshold: 0.75
  task: '新增一个 Photo 模式的 preset。请判断以下字段填什么。


    ```

    Preset: 新预设，Mode=Photo

    Portrait Effect: 不是人像模式

    Bokeh: 同上

    Filter: 没有用滤镜

    Tuning: 没有调色参数

    ```

    '
  rubric:
  - id: r1
    check: Portrait Effect 和 Bokeh 填「不涉及」
    weight: 2
  - id: r2
    check: Filter 填「Original」，Tuning 填「无」
    weight: 2
  - id: r3
    check: 区分了「不涉及」和「无」的不同含义
    weight: 1
- id: case-cricket-sports-sync
  threshold: 0.75
  task: 'Cricket 的 Tuning 从 Vignette +15 改为 Contrast +10。Sports 要不要同步？


    ```

    Cricket: Watermark=On，印度 RCB 版

    Sports: Watermark=Off，ROW 版

    核心参数应保持一致

    ```

    '
  rubric:
  - id: r1
    check: 回答 Sports 的 Tuning 必须同步改为 Contrast +10
    weight: 2
  - id: r2
    check: 核心参数一致，仅 Watermark 和 备注 可以不同
    weight: 2
  - id: r3
    check: Cricket=On/印度，Sports=Off/ROW
    weight: 1
- id: case-focal-format
  threshold: 0.75
  task: 'Sports 在 25111 上 160mm，25131 上 24mm。写出 Focal Length 格式。


    ```

    25111 焦段: 160mm

    25131 焦段: 24mm

    格式: {project_code}-{focal}，多项目竖线分隔

    ```

    '
  rubric:
  - id: r1
    check: 输出 25111-160mm | 25131-24mm
    weight: 2
  - id: r2
    check: 所有项目相同时直接写如 50mm
    weight: 2
  - id: r3
    check: 格式正确
    weight: 1
- id: case-cover-spec
  threshold: 0.75
  task: '给 Cine Amber（Video）和 Urban（Photo）分别准备封面图，尺寸要求？


    ```

    Cine Amber: Mode=Video

    Urban: Mode=Photo

    封面比例取决于预设的 Mode 类型

    ```

    '
  rubric:
  - id: r1
    check: Urban (Photo) 要求 1080×1440 竖幅
    weight: 2
  - id: r2
    check: Cine Amber (Video) 要求 16:9 横版
    weight: 2
  - id: r3
    check: 说明了封面比例取决于 Mode
    weight: 1
- id: case-field-validation
  threshold: 0.75
  task: '检查这个 Cine Amber preset 是否有问题。


    ```

    Preset Name: Cine Amber

    Mode: Video

    Lens: Rear

    Portrait Effect: 无

    Bokeh: 无

    Flash: On

    ```

    '
  rubric:
  - id: r1
    check: 指出 Portrait Effect 和 Bokeh 应填「不涉及」而非「无」
    weight: 2
  - id: r2
    check: 区分「不涉及」= 不适用，「无」= 适用但为空
    weight: 2
  - id: r3
    check: 没有错误指出 Flash 有问题
    weight: 1
- id: case-input-quality
  threshold: 0.75
  task: '用户说"帮我更新一下 preset"，没给任何其他信息。请根据 SKILL.md 的 Input Quality Check 规则回答：这时候应该直接操作吗？需要确认哪些信息？


    ```

    用户输入: "帮我更新一下 preset"

    已知信息: 无

    缺失信息: 哪个 Preset？什么操作？改什么？

    ```

    '
  rubric:
  - id: r1
    check: 回答不应该直接操作，输入信息不足
    weight: 2
  - id: r2
    check: 回答需要确认：哪个 Preset？做什么操作（新增/修改/删除）？修改哪些字段？
    weight: 2
  - id: r3
    check: 对一句话需求追问而非直接执行
    weight: 1
