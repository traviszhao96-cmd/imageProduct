cases:
- id: case-spelling-compat
  threshold: 0.75
  task: '用户要查 portrait 模式照片数。请根据 SKILL.md 的拼写兼容规则写 Athena SQL。


    ```

    需求: 统计 photoMode 为 portrait 的照片数

    问题: 历史数据拼写为 protrait

    表: data_mobile_behavior

    规则: 必须同时查两种拼写

    ```

    '
  rubric:
  - id: r1
    check: SQL 同时包含 portrait 和 protrait，用 OR 或 IN
    weight: 2
  - id: r2
    check: 使用 param.key='photoMode'
    weight: 2
  - id: r3
    check: 没有遗漏 protrait
    weight: 1
- id: case-retention-window
  threshold: 0.75
  task: '用户要查 2025 年 8 月的数据。请根据 SKILL.md 的保留窗口规则回答。


    ```

    需求: 查询 2025 年 8 月的 photo_mode 分布

    当前日期: 2026 年 6 月

    保留期限: 约 6 个月

    判断: 2025 年 8 月距今超过保留期

    ```

    '
  rubric:
  - id: r1
    check: 回答数据已超出约 6 个月保留期限
    weight: 2
  - id: r2
    check: 建议重定向到保留窗口内的日期
    weight: 2
  - id: r3
    check: 没有直接写出超出保留期的查询
    weight: 1
- id: case-overseas-exclusion
  threshold: 0.75
  task: '用户要查 Action 模式在海外市场的使用率。请根据 SKILL.md 写 Athena SQL。


    ```

    需求: 海外市场 action mode 渗透率

    排除: China, Hong Kong

    指标: 同时报事件量和用户渗透率

    ```

    '
  rubric:
  - id: r1
    check: SQL 包含 WHERE country NOT IN ('China', 'Hong Kong')
    weight: 2
  - id: r2
    check: 使用 photoMode='action' 过滤
    weight: 2
  - id: r3
    check: 同时报出事件量和用户渗透率
    weight: 1
- id: case-sql-patterns
  threshold: 0.75
  task: '用户要查照片的 zoom_ratio 分布。请根据 SKILL.md 写出 Athena SQL。


    ```

    需求: 各 zoom_ratio 的照片数量分布

    表: data_mobile_behavior, key=photo_info

    注意: zoom_ratio 是浮点数

    ```

    '
  rubric:
  - id: r1
    check: 使用 CROSS JOIN UNNEST(event_params) 展开
    weight: 2
  - id: r2
    check: 使用 ROUND(zoom_ratio, 1) 处理浮点匹配
    weight: 2
  - id: r3
    check: 使用 CTE 分层，中文注释
    weight: 1
- id: case-filter-vs-preset
  threshold: 0.75
  task: '用户问"用了 CC Film 滤镜的照片有多少"。请根据 SKILL.md 回答应该查哪个字段。


    ```

    需求: 统计 CC Film 滤镜使用量

    可用字段: filter, preset

    别名: cc → CC Film

    ```

    '
  rubric:
  - id: r1
    check: 回答查 filter 字段，不能用 preset
    weight: 2
  - id: r2
    check: 理由：preset 是预设模式，和滤镜不同
    weight: 2
  - id: r3
    check: 提到别名映射 cc → CC Film
    weight: 1
- id: case-input-quality
  threshold: 0.75
  task: '用户说"帮我查一下相机数据"。请根据 SKILL.md 判断如何处理。


    ```

    用户输入: "帮我查一下相机数据"

    已知信息: 无

    缺失: 指标、模式、时间范围、数据源

    ```

    '
  rubric:
  - id: r1
    check: 回答不应直接写 SQL，输入不足
    weight: 2
  - id: r2
    check: 回答需确认：什么指标？什么模式？什么时间范围？
    weight: 2
  - id: r3
    check: 对模糊需求追问而非猜测
    weight: 1
