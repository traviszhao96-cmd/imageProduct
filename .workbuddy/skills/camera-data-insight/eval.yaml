      event tracking design, and PRD writing, see `camera-
    case_ids: []
  - heading: '## Input Quality Check'
    content_sha256: 1f90e8629af6e2c603d0adfe47ab2637cad2e8b14722ae368fa5fc35b7d6edab
    content_snippet: '开始任何查询前，先判断用户输入是否足够。一句话需求（如"帮我查一下数据"、"看看相机使用率"）必须先追问： | 缺乏的信息
      | 需要确认 | |-----------|---------| | 查什么指标？ | 使用率、渗透率、分布、趋势 | | 什么模式/参数？ | photoMode、camera_id、filter
      等 | | 什么时间范围？ | 日期范围（注意 6 个月保留限制） | | '
    case_ids: []
  - heading: '## Data Sources'
    content_sha256: 706192d48e9f46db2770ebe4357c4d2d95042bb6c30647159bfed91ed90a4a01
    content_snippet: '### 1. Athena (data_mobile_behavior) Athena/Presto 语法。主表 `data_mobile_behavior`。用于大规模
      Camera 埋点分析。 ### 2. Remote SQLite (server_sqlite_query_client.py) HTTP 远程 SQLite
      数据库。常用表：`photo_events_parsed`、`ca'
    case_ids: []
  - heading: '## SQL Rules'
    content_sha256: f2079a72b4bd0c3614ff774fe31d87f312e54eb0afebd6a83974aed948d03413
    content_snippet: '### Athena 模式 - 使用 `CROSS JOIN UNNEST(event_params) AS t(param)`
      展开参数 - 过滤参数：`param.key = ''...''` 和 `param.string_value IS NOT NULL` - 浮点字段用
      `ROUND(value, 1)` 匹配 - 数值用 `TRY_CAST(REGEXP_EXTRACT(...))` 提'
    case_ids: []
  - heading: '## 历史拼写兼容'
    content_sha256: d47f25cfdd64e90402ef33b7edaf71b7b8dc1b939b6ac7ce5c0f8019347270fc
    content_snippet: 查询时需兼容历史拼写错误，**不要用"正确"拼写过滤**（会漏掉历史数据）： | 原值 | 正确值 | 影响 | |------|-------|------|
      | `protrait` | `portrait` | photoMode | | `tuning_shapen` | `tuning_sharpen`
      | label | | `pef_info` | `perf_info` | key
    case_ids: []
  - heading: '## 数据保留窗口'
    content_sha256: ba10d2573da7b8ec3acd9d3b00910d381ab26845b87d538eaff4525d5fddf143
    content_snippet: Camera 埋点数据仅保留约 6 个月。不要写超出保留期的查询。如果用户要求的时间超出窗口，告知并建议重定向。
    case_ids: []
  - heading: '## 海外分析'
    content_sha256: afee016f61385c5b8680ba72d0a12b3eab51f44a984fecd30fed9144ca75f5f3
    content_snippet: 默认排除 `China` 和 `Hong Kong`，除非用户明确覆盖。
    case_ids: []
  - heading: '## 常用字段'
    content_sha256: 0705162daaf43195874ab04d4fdf693fcf1beed80bf04a5c074899f59b91ea11
    content_snippet: '### photo_events_parsed (SQLite) `event_date`, `exact_time`,
      `user_pseudo_id`, `model_name`, `country`, `photo_mode`, `camera_id`, `zoom_ratio`,
      `lux`, `adrc`, `cct`, `face_count`, `orientation`, `nig'
    case_ids: []
  - heading: '## Mode Selection'
    content_sha256: fd5f01553e81f48cdddda923537984af777454fce1c39d6711ff91e1259a050c
    content_snippet: '- "帮我查"、"统计"、"写 SQL"、"渗透率" → 写 SQL - "生成报告"、"解读"、"根据链接出结论" →
      生成报告 - 两者混合 → 先写 SQL，再出报告'
    case_ids: []
  - heading: '## Report Output'
    content_sha256: 06e1b96b1d6f65dc1398381f4c1d9f0e2340e87e6a1a6296644e79d618ec9dce
