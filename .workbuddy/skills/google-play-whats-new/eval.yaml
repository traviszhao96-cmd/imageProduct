eval_type: content
cases:
- id: case-features-to-copy
  threshold: 0.75
  task: '以下是 Gallery 功能更新的 PRD 摘要。请根据 SKILL.md 的 Writing Rules 和 App Store Style Heuristics，写出
    500 字符以内的 Google Play What''s New 英文文案。


    ```

    Gallery v3.0 updates:

    - Album page: long-press drag to reorder albums, move between large/small zones

    - Sort by: recently added or captured date, with permanent memory

    - Filter by: All, Favourite, Edited, Photo, Video, Screenshots

    - Map Album: browse photos by location on map

    ```

    '
  rubric:
  - id: r1
    check: 输出在 500 字符以内，且报告了字符数
    weight: 2
  - id: r2
    check: 文案覆盖了来源中至少 3 个功能点（排序、筛选、拖拽、地图相册中至少三个）
    weight: 2
  - id: r3
    check: 文案为英文，无 marketing 夸大词（best ever / revolutionary / powerful），无模糊用语如 various
      improvements
    weight: 1
- id: case-fact-check
  threshold: 0.75
  task: '以下是一份 PRD 摘要，以及一个 PM 草拟的 What''s New 文案。请根据 SKILL.md 的 Fact-Checking Against
    Docs 规则，审查文案并指出哪些声明没有来源支持。


    ```

    PRD: Camera 5.0 - shutter button redesigned from circle to oval.

    All modes supported. Tool panel icons refreshed.

    ```


    ```

    草拟文案:

    "Capture every moment with our redesigned camera. The new oval

    shutter is faster and more responsive across all modes. Fresh

    tool icons make editing photos easier than ever."

    ```

    '
  rubric:
  - id: r1
    check: 指出 'faster and more responsive' 没有来源支持，PRD 只说了形状改变，没说性能提升
    weight: 2
  - id: r2
    check: 指出 'make editing photos easier than ever' 是夸大，来源说的只是工具栏图标刷新，不是编辑功能改进
    weight: 2
  - id: r3
    check: 修正版本去掉了没有来源支持的声明
    weight: 1
- id: case-char-limit-variants
  threshold: 0.75
  task: '同一个功能更新需要写 80 字符和 200 字符两个版本。请根据 SKILL.md 的 Output Format，分别写出两个版本，标注字符数。


    ```

    功能: Gallery now supports Map Album — browse photos and

    videos by location on an interactive map. Tap clusters to

    explore, use the locate button to jump to your current position.

    Available from Albums and Photo Details pages.

    ```

    '
  rubric:
  - id: r1
    check: 输出两个版本，各自标注字符数
    weight: 2
  - id: r2
    check: 80 字符版本不超过 80，200 字符版本不超过 200
    weight: 2
  - id: r3
    check: 两个版本的核心信息一致，只是详细程度不同
    weight: 1
