  threshold: 0.75
  task: '用户说"预览延迟要快一些"。PRD 的性能目标怎么写？


    ```

    用户输入: 预览延迟要快一些

    正确做法: 写 [TBD]，不编造数字

    示例: [TBD — 需算法侧给出预览延迟基线]

    ```

    '
  rubric:
  - id: r1
    check: 回答写 [TBD — 需算法侧给出预览延迟基线]
    weight: 2
  - id: r2
    check: 不编造具体数字如 200ms
    weight: 2
  - id: r3
    check: '[TBD] 带责任人标注'
    weight: 1
- id: case-input-completeness
  threshold: 0.75
  task: '用户说"帮我写一个相机滤镜的 PRD"，没给任何信息。应该直接写还是先追问？


    ```

    用户输入: "帮我写一个相机滤镜的 PRD"

    已知信息: 无

    缺失: 机型、市场、功能边界、技术依赖

    ```

    '
  rubric:
  - id: r1
    check: 回答不应直接写 PRD，先追问
    weight: 2
  - id: r2
    check: 列出缺失项：机型、功能边界、技术依赖
    weight: 2
  - id: r3
    check: 使用追问模板格式
    weight: 1
- id: case-naming-convention
  threshold: 0.75
  task: 'Camera 运动抓拍和 Gallery 相册排序，各自的 PRD 标题怎么写？


    ```

    Camera 功能: 运动抓拍

    Gallery 功能: 相册排序

    规则: 统一加领域前缀

    ```

    '
  rubric:
  - id: r1
    check: Camera 为「【PRD】Camera 运动抓拍」
    weight: 2
  - id: r2
    check: Gallery 为「【PRD】Gallery 相册排序」
    weight: 2
  - id: r3
    check: 区分 Camera 和 Gallery 领域前缀
    weight: 1
- id: case-memory-mutex-required
  threshold: 0.75
  task: 'PM 写 Camera PRD，功能涉及用户可修改的状态。PRD 中必须额外定义哪两个内容？


    ```

    功能: 有用户可修改状态的新功能

    记忆规则: 切换模式/杀进程等 9 种场景

    互斥: 与其他功能的冲突关系

    ```

    '
  rubric:
  - id: r1
    check: 回答必须定义记忆规则（9 种场景）
    weight: 2
  - id: r2
    check: 回答必须定义功能互斥
    weight: 2
  - id: r3
    check: 提到可参考 memory-mutex.json
    weight: 1
- id: case-delegate-tracking
  threshold: 0.75
  task: 'PM 写 PRD 时问"埋点怎么设计"。根据 SKILL.md 应该怎么处理？


    ```

    功能: Camera 前后双录

    需求: 设计埋点

    正确做法: 委托专门的埋点 skill

    ```

    '
  rubric:
  - id: r1
    check: 回答 Camera 委托 camera-tracking-manage，Gallery 委托 gallery-event-tracking
    weight: 2
  - id: r2
    check: PRD writer 负责文档，不负责埋点设计
    weight: 2
  - id: r3
    check: 不直接写埋点，委托对应 skill
    weight: 1
- id: case-scoring-rubric
  threshold: 0.75
  task: 'PM 要求对 PRD 做 agent 评审打分。评审包含几个维度？满分多少？


    ```

    需求: 评审 Camera PRD

    模式: review + scoring

    输出: DONE / DONE_WITH_CONCERNS / BLOCKED / NEEDS_CONTEXT

    ```

    '
  rubric:
  - id: r1
    check: 回答 4 个评审维度：dev review, test review, smuggling check, scoring
    weight: 2
  - id: r2
    check: 回答 scoring 满分 100，8 个维度
    weight: 2
  - id: r3
    check: 回答输出状态标注（DONE/DONE_WITH_CONCERNS/BLOCKED/NEEDS_CONTEXT）
    weight: 1
- id: case-feishu-writing-strategy
  threshold: 0.75
  task: 'PRD 发布到飞书，内容含文本和一张 12 行的埋点表格。根据 SKILL.md 怎么分段写入才能避免 API 报错？


    ```

    内容结构: 文本 → 12行表格 → 文本

    风险1: descendant 不能写表格，报 HTTP 400

    风险2: 表格 >9 行报 400 invalid param

    风险3: 单元格 DELETE 不生效，出现多余空行

    ```

    '
  rubric:
  - id: r1
    check: 文本用 descendant（convert → descendant），表格用 children 单独创建，不可混用
    weight: 2
  - id: r2
    check: 12 行表格拆为两个子表（≤9 行），每个子表重复表头
    weight: 2
  - id: r3
    check: 单元格用 PATCH update_text_elements 更新已有文本块，不能用 DELETE+POST
    weight: 1
