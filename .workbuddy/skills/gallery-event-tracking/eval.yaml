    case_ids: []
  - heading: '## Privacy-First Rule'
    content_sha256: ac5edd7dde3d8b73b347419e2709aa288f432bf934efee8dfb76b4e109dc1cfb
    content_snippet: '**只改文字内容、不改任何样式 → 不上报 edit_text。** 理由： - 文字内容属于用户隐私，不应通过埋点泄露
