  - heading: '## Re-edit Detection'
    content_sha256: e42f76ba7e9c1e6db25746b76ec454bc4454eaef522aeeeb27f0bb699f407349
    content_snippet: 编辑可能是全新创作，也可能是在历史图片上二次修改。用 `is_reedit` 区分： | is_reedit | 含义 |
