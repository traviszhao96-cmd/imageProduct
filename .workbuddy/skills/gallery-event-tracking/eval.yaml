version: '1.0'
skill_id: gallery-event-tracking
eval_type: content
cases:
- id: case-edit-pattern
  threshold: 0.75
  task: 'PM 要为 Gallery 新增的「Draw」编辑功能设计埋点。请根据 SKILL.md 的编辑类埋点模式，写出需要的 event_name 和参数，按标准
    5 列表格输出。


    ```

    功能: Draw (画笔)

    入口: 编辑模块 → Draw

    工具: 画笔 (brush)

    保存参数: color=#FF0000, thickness=5

    ```

    '
  rubric:
  - id: r1
    check: 输出包含 edit_action 事件，enter_module=draw，且包含 UUID
    weight: 2
  - id: r2
    check: 输出包含 edit_draw 保存结算事件，参数包含 color 和 thickness 的最终值，且 UUID 与 edit_action
      一致
    weight: 2
  - id: r3
    check: 输出为标准的 5 列表格格式 (event_name | key | key_description | parameter_value |
      说明)
    weight: 1
- id: case-reuse-existing
  threshold: 0.75
  task: 'PM 要为「Map Album 中收藏照片」这个操作设计埋点。请根据 SKILL.md 的 Event Patterns Reference，回答：(1)
    应该复用哪个已有 event_name？(2) 需要哪些参数？列出完整的 5 列表格。(3) 这个操作是否需要新增 event_name？


    ```

    操作: 在地图相册中点击照片，选择收藏

    来源视图: map_album

    操作类型: 收藏单张照片

    ```

    '
  rubric:
  - id: r1
    check: 回答复用 media_manage event，不需要新增 event_name
    weight: 2
  - id: r2
    check: 参数包含 action=favorite, source_view=map_album, select_count=1, media_type=photo
    weight: 2
  - id: r3
    check: 回答说明了复用原则：已有 event family 能覆盖就不要新建
    weight: 1
- id: case-save-time-settlement
  threshold: 0.75
  task: '开发问：用户用 Draw 先选红色画了 3 笔，换蓝色画了 2 笔，撤销 1 笔蓝色，点保存。应该报哪些参数？请根据 SKILL.md 回答。


    ```

    时间线:

    1. 进入 Draw

    2. 选红色 → 画 3 笔

    3. 换蓝色 → 画 2 笔

    4. 撤销 1 笔蓝色

    5. 点保存

    ```

    '
  rubric:
  - id: r1
    check: 回答只在保存时上报最终结果，不是每次操作都报
    weight: 2
  - id: r2
    check: 回答最终颜色是蓝色，笔画数报 4
    weight: 2
  - id: r3
    check: 回答撤销不需要单独上报，除非产品明确要分析撤销频率
    weight: 1
- id: case-reedit-detection
  threshold: 0.75
  task: '用户在一张已有历史 text 的图片上进入 Text 编辑，新增了 1 个 text。请根据 SKILL.md 的 Re-edit Detection
    规则回答：(1) 保存时应该报 is_reedit = 0 还是 1？(2) text_details 应该报什么？(3) 为什么需要 is_reedit
    这个字段？


    ```

    初始状态: 图片上已有 T1（上次编辑留下的）

    本次操作: 新增 T2，保存

    最终画布: T1 + T2 共存

    ```

    '
  rubric:
  - id: r1
    check: 回答 is_reedit = 1，因为画布上已有历史内容 T1
    weight: 2
  - id: r2
    check: 回答 text_details 报 T1*1, T2*1，传最终画面全貌
    weight: 2
  - id: r3
    check: 回答 is_reedit 的作用是让数据端区分首次创作和二次修改，避免把 T1+T2 误判为一次新增 2 个
    weight: 1
- id: case-privacy-first
  threshold: 0.75
  task: '用户进入 Text 编辑，把 T1 的文字从"你好"改成"再见"，字体、颜色、对齐都没换，直接保存。请根据 SKILL.md 的 Privacy-First
    Rule 回答：(1) 要不要上报 edit_text？(2) 为什么？(3) 如果 PM 真的想知道"多少人改过文字内容"，怎么加？


    ```

    操作:

    进入 Text → 点开 T1 → 改文字内容 → 保存

    样式变化: 无

    分析需求: PM 想知道文字编辑的保存率

    ```

    '
  rubric:
  - id: r1
    check: 回答不上报 edit_text，因为只改了文字内容、样式无变化
    weight: 2
  - id: r2
    check: 回答原因是隐私优先：文字内容属于用户隐私。用户进入 Text 的动作已由 edit_action 记录
    weight: 2
  - id: r3
    check: '回答如果需要数据，加轻量的 text_edited: 0/1 flag，不报内容不报样式'
    weight: 1
