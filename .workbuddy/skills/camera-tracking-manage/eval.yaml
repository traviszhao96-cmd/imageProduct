version: '1.0'
skill_id: camera-tracking-manage
eval_type: content
cases:
- id: case-photo-info-new-param
  threshold: 0.75
  task: 'PM 要为拍照模式新增 Flicker sensor 光源频率参数。请按 9 列格式写出完整定义。


    ```

    代码变量: m_currentLightFrequency

    含义: sensor 输出的光源频率

    值: 原始数值，如 0, 100, 120, 240

    挂载位置: 拍照成片时上报

    ```

    '
  rubric:
  - id: r1
    check: 回答挂在 photo_info 下，label 命名为 flicker_sensor_output（snake_case）
    weight: 2
  - id: r2
    check: string_value 写 xxx，不是硬编码枚举
    weight: 2
  - id: r3
    check: label_note 说明对应代码变量
    weight: 1
- id: case-toggle-feature
  threshold: 0.75
  task: 'PM 要新增视频自动帧率功能。请按 9 列格式写出埋点。


    ```

    功能: 视频自动帧率

    选项: 关 / 自动30fps / 自动30&60fps

    触发: 用户更改时

    ```

    '
  rubric:
  - id: r1
    check: 使用独立 key auto_fps，key_note 为「视频自动帧率——功能开关」
    weight: 2
  - id: r2
    check: string_value 用字符串 off / auto_30 / auto_30_60，不是数字 0/1/2
    weight: 2
  - id: r3
    check: label 和 label_note 留空
    weight: 1
- id: case-string-over-numeric
  threshold: 0.75
  task: 'PM 要新增前后双录的拼接方式参数。请根据 SKILL.md 的新参数命名原则，判断用数字还是字符串，写出值定义。


    ```

    参数: 拼接方式

    选项: 上下分屏, 画中画

    现状: camera_id 等旧参数用数字编码（0/1/2/3）

    ```

    '
  rubric:
  - id: r1
    check: 回答用字符串枚举 top_bottom / pip，不用数字 0/1
    weight: 2
  - id: r2
    check: 理由：新参数优先用可读字符串。旧参数（camera_id）保持数字不动，不反复改
    weight: 2
  - id: r3
    check: 没有要求修改任何已有数字参数
    weight: 1
- id: case-extend-vs-new-flag
  threshold: 0.75
  task: '前后双录：方案 A 加 dual_record flag，方案 B 作为 video_mode=4。请判断。


    ```

    现有 video_mode:

    1 = Video（普通录像）

    2 = Slo-mo（慢动作）

    3 = Time-lapse（延时摄影）

    前后双录: 也是视频录制模式

    ```

    '
  rubric:
  - id: r1
    check: 选择方案 B，video_mode=4
    weight: 2
  - id: r2
    check: 理由：前后双录是独立视频模式，应扩展现有枚举而非加 flag
    weight: 2
  - id: r3
    check: 提到方案 A 需跨字段查询，方案 B 一行 SQL 就够了
    weight: 1
- id: case-separate-vs-integrate
  threshold: 0.75
  task: '运动速度等级原本打算拼入 shot_algo。请判断为什么独立 label 更好。


    ```

    代码变量: m_currentMotionLevel

    含义: 检测到的运动速度等级

    shot_algo: 算法名称（已有字段）

    拼入方案: shot_algo 值变为 "zsl+motion_snap_exp_reduce"

    ```

    '
  rubric:
  - id: r1
    check: 回答用独立 label motion_level，不并入 shot_algo
    weight: 2
  - id: r2
    check: 理由：运动速度是独立概念，和算法名不同。拼入后需字符串拆分查询
    weight: 2
  - id: r3
    check: label 挂在 photo_info 下，label_note 对应 m_currentMotionLevel
    weight: 1
- id: case-spelling-compatibility
  threshold: 0.75
  task: 'photoMode 的 protrait（拼错）和 portrait（正确）同时存在，已上线。


    ```

    错误值: protrait

    正确值: portrait

    状态: 已上线，有大量历史数据

    影响: 数据分析时要同时查两个值

    ```

    '
  rubric:
  - id: r1
    check: 回答不修正原值，protrait 保持不动
    weight: 2
  - id: r2
    check: 回答在备注标注拼写错误和正确值
    weight: 2
  - id: r3
    check: 回答查询时兼容两种写法
    weight: 1
