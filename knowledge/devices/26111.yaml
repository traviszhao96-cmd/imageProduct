# 26111 Camera 项目概览
# 最后更新: 2026-06-18
# 硬件选型已确认 (Travis)

project:
  code: "26111"
  name: "Phone 5a"
  codename: "Caterpie"
  models: ["Phone 5a (Base)", "Phone 5a Pro"]
  market: "印度"
  soc:
    base: "SM7635 (Snapdragon 7s Gen3)"
    pro: "SM7750 (Snapdragon 7 Gen4)"
  android_version: "[TBD]"
  software_baseline: "25111 Pro + NOS5.0"

cameras:
  base:
    front:
      sensor: "OV32D"
      resolution: "32MP"
      datasheet: "❌ 未创建"
      specs: "[TBD — 待补充完整规格]"

    main:
      sensor: "HP5"
      resolution: "200MP"
      ois: NO
      datasheet: "❌ 未创建"
      specs: "[TBD — 待补充完整规格]"
      note: "200MP 高像素，无 OIS"

    ultrawide:
      sensor: "IMX355"
      resolution: "8MP"
      af: "FF (fixed focus)"
      datasheet: "❌ 未创建"
      specs: "[TBD — 待补充完整规格]"

    tele: "❌ (仅 Flicker Sensor，无长焦镜头)"

    video_capability:
      4k: "❌"
      1080p60: "❌"
      video_hdr: "❌"

  pro:
    note: "26121 Pro 配置与 25111 Pro 完全一致"

    front:
      sensor: "KD1"
      resolution: "32MP"
      datasheet: "❌ 未创建"
      specs: "[TBD — 待补充完整规格]"

    main:
      sensor: "IMX896"
      resolution: "50MP"
      ois: YES
      datasheet: "✅ devices/sensors/IMX896-AJH5-C.yaml"
      note: "与 25111 Pro 同款"

    ultrawide:
      sensor: "IMX355"
      resolution: "8MP"
      af: "FF (fixed focus)"
      datasheet: "❌ 未创建"
      specs: "[TBD — 待补充完整规格]"

    tele:
      sensor: "JN5 (S5KJNSSQ33)"
      resolution: "50MP"
      ois: YES
      zoom: "3.5x"
      datasheet: "✅ devices/sensors/S5KJNSSQ33.yaml"
      note: "与 25111 Pro 同款"

    video_capability:
      4k60: "✅ SAT / Ultra 主摄&长焦"
      video_hdr: "✅"

# 各模式默认值（25111 MP1.5 基线，26111 继承）
# 其他配置中可引用"使用默认值"即指向此处定义的值
defaults:
  photo:
    mode: "照片"
    camera: "后置"
    flash: "关"
    timer: "关"
    ratio: "4:3"
    hdr: "Auto"
    autotone: "关"
    motion_photo: "关"
    high_resolution: "12MP"
    filter: "关"
    filter_strength: "10.0"
    beauty: "关"
    exposure: "0"
    grid: "关"
    glyph_mirror: "关"
    night_mode: "自动开"
    ai_zoom: "20x-自动开"
    doc_mode: "关"
    fallback_auto: "自动开"
  portrait:
    focal_length: "3.5x"       # 倍率，25111 系列；24111 为 2x，24111 Plus 为 3x
    equivalent_focal: "80mm"   # 等效焦距，对应 3.5x 长焦；24111 2x≈50mm，24111 Plus 3x≈72mm
    aperture: "1.4/2.8"        # 不同焦段不一样
  video:
    hdr: "关"
    resolution: "1080P30fps"
    rec_light: "开"
  slow_motion:
    resolution: "1080P120fps"
  timelapse:
    speed: "1080P15x"
    resolution: "1080P30fps"
  pro:
    lens: "1x"
    parameters: "自动"
    raw: "关"
  front:
    flash: "自动"
    zoom: "1.2x"
  settings:
    location: "开"
    shutter_sound: "跟随系统"
    mirror_front: "开"
    level: "关"
    touch_shoot: "关"

inheritance:
  baseline: "25111 Pro + NOS5.0"
  rules:
    - "26111 Base: 200M HP5 主摄，无长焦，继承 25131 功能并移除不适用项"
    - "26121 Pro: 与 25111 Pro 配置完全一致，全功能继承"
    - "新增功能以 26111 PRD 为准"
    - "算法链路以 SE 确认的 26111 算法列表为准"

key_deltas_from_25131_base:
  - "主摄: JN1 50MP → HP5 200MP (无 OIS)"
  - "超广角: GC08A8 → IMX355"
  - "前置: GC16B3C → OV32D"
  - "Base 无长焦（仅 Flicker Sensor）"
  - "Base 无 4K、无 1080P60、无 Video HDR"
  - "NOS5.0 软件基线"

new_features_p0:
  - "运动抓拍（继承25131交互，新增普通模式引导入口）"
  - "HDR 运动场景升级 + 影调升级 + 智能分区"
  - "成像预览一致性（2DOL 优先）"
  - "自然质感人像（美颜升级）"
  - "AIGC/SR 效果优化"
  - "4K 60FPS (Pro SAT / Ultra 主摄&长焦)"
  - "前置/广角 4K (upscale)"
  - "Preset 3.0 + AI Preset"
  - "照片风格（自然 & 鲜明）"
  - "专业模式 2.0"
  - "双摄同录 v2"
  - "录制中前后镜头切换"
  - "视频专业参数调节"

removed_features:
  - "TF 50MP QuadBayer Raw HDR"
  - "TF 25MP"
  - "聚会模式"
  - "视频 Log 模式"
  - "视频录制红框提示"

feature_deltas:
  # Structured deltas used by generate.py for feature list generation.
  # new_features_p0 and removed_features are human-readable summaries;
  # this section provides machine-processable structured data.
  rear_additions:
    - mode: "运动抓拍 (Action)"
      category: "拍摄"
      group: "运动检测"
      name: "独立运动抓拍模式"
      support: {ultrawide: supported, main: supported, macro: unsupported}
      verify: "模式选择栏最左侧入口"
    - mode: "运动抓拍 (Action)"
      category: "拍摄"
      group: "运动检测"
      name: "高速快门策略"
      support: {ultrawide: supported, main: supported, macro: unsupported}
      verify: "检测运动 → 自动提升快门"
    - mode: "运动抓拍 (Action)"
      category: "拍摄辅助"
      group: "焦段"
      name: "焦段点切（不支持滑动变焦）"
      support: {ultrawide: supported, main: supported, macro: unsupported}
      verify: "仅点切 1x/3x"
    - mode: "运动抓拍 (Action)"
